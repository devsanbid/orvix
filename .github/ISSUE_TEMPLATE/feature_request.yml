name: Feature request
description: Suggest an option, a Settings page or a change in behaviour
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem
      description: What you're trying to do and where Orvix gets in the way.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: |
        If it belongs in Settings, say which page. If it's a shell change, say
        where it should go (bar, launcher, dashboard…).
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Settings
        - Bar / launcher / dashboard
        - Theme and colors
        - Hyprland config
        - Installer / updates / CLI
        - Omarchy coexistence
        - Other
    validations:
      required: true
